[package]
name = "stagemics"
version = "0.1.0"
description = "StageMics: scene-by-scene radio-mic control for the Allen & Heath dLive"
authors = ["Salvation Productions"]
license = ""
repository = "https://github.com/crownemmanuel/StageMics"
edition = "2024"
rust-version = "1.90"

[lib]
name = "stagemics_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
